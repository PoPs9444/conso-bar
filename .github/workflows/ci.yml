name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Validate and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DISABLE_AUTOUPDATER: '1'
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.316

      - name: Validate the plugin
        run: claude plugin validate .

      - name: Run the tests
        run: claude plugin test .

      - name: Check that the two version numbers match
        run: |
          manifest=$(node -p "require('./.claude-plugin/plugin.json').version")
          code=$(sed -n "s/^export const VERSION = '\(.*\)'$/\1/p" hooks/register.tsx)
          echo "plugin.json: $manifest, hooks/register.tsx: $code"
          test "$manifest" = "$code"
