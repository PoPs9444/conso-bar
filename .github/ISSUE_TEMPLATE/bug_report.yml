name: Bug report
description: Something in Conso does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug. The more precise the report, the faster the fix.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a new conversation
        2. Click Compact
        3. ...
    validations:
      required: true
  - type: input
    id: conso
    attributes:
      label: Conso version
      description: Shown at the bottom of the panel.
      placeholder: v0.22.0
    validations:
      required: true
  - type: input
    id: claude
    attributes:
      label: Claude Code version
      description: The output of `claude --version`.
      placeholder: 2.1.316
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where
      options:
        - Desktop app
        - Terminal
        - IDE extension
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: A screenshot of the panel helps a lot. Hide anything private first.
